# Local PostgreSQL 18 for development and integration tests.
#   pnpm db:up
#   export DATABASE_URL=postgres://library:library@localhost:5432/library
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U library -d library']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
